# -----------------------------------------------------
# Keybindings
# https://wiki.hypr.land/Configuring/Binds/
# -----------------------------------------------------

$mainMod = SUPER # Sets "Windows" key as main modifier

# Apps
bind = $mainMod, T, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, B, exec, $browser

# Screenshot (MOD+S, region to clipboard by default, SHIFT -> capture screen, CTRL -> save to file)
bind = $mainMod, S, exec, hyprshot -m region -m active --clipboard-only
bind = $mainMod SHIFT, S, exec, hyprshot -m output -m active --clipboard-only
bind = $mainMod CTRL, S, exec, hyprshot -m region -m active -o ~/Pictures/Screenshots
bind = $mainMod CTRL SHIFT, S, exec, hyprshot -m output -m active -o ~/Pictures/Screenshots

# Misc binds
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, layoutmsg, togglesplit # dwindle
bind = $mainMod, M, exec, hyprctl keyword general:layout monocle
bind = $mainMod SHIFT, M, exec, hyprctl keyword general:layout dwindle
bind = $mainMod, Tab, layoutmsg, cyclenext
bind = $mainMod SHIFT, Tab, layoutmsg, cycleprev
bind = CTRL ALT, Q, exec, hyprlock

# Move focus with mainMod + hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Swap windows with mainMod + SHIFT + hjkl
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, L, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Toggle off special workspace when switching to other workspace
bind = $mainMod, 1, togglespecialworkspace, __TEMP
bind = $mainMod, 1, togglespecialworkspace, __TEMP
bind = $mainMod, 2, togglespecialworkspace, __TEMP
bind = $mainMod, 2, togglespecialworkspace, __TEMP
bind = $mainMod, 3, togglespecialworkspace, __TEMP
bind = $mainMod, 3, togglespecialworkspace, __TEMP
bind = $mainMod, 4, togglespecialworkspace, __TEMP
bind = $mainMod, 4, togglespecialworkspace, __TEMP
bind = $mainMod, 5, togglespecialworkspace, __TEMP
bind = $mainMod, 5, togglespecialworkspace, __TEMP
bind = $mainMod, 6, togglespecialworkspace, __TEMP
bind = $mainMod, 6, togglespecialworkspace, __TEMP
bind = $mainMod, 7, togglespecialworkspace, __TEMP
bind = $mainMod, 7, togglespecialworkspace, __TEMP
bind = $mainMod, 8, togglespecialworkspace, __TEMP
bind = $mainMod, 8, togglespecialworkspace, __TEMP
bind = $mainMod, 9, togglespecialworkspace, __TEMP
bind = $mainMod, 9, togglespecialworkspace, __TEMP
bind = $mainMod, 0, togglespecialworkspace, __TEMP
bind = $mainMod, 0, togglespecialworkspace, __TEMP


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move workspace to monitor with mainMode + CTRL + left|right
bind = $mainMod CTRL, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, right, movecurrentworkspacetomonitor, r

# IM workspace
bind = $mainMod, W, togglespecialworkspace, im
bind = $mainMod SHIFT, W, movetoworkspace, special:im
# Mail workspace
bind = $mainMod, E, togglespecialworkspace, mail
bind = $mainMod SHIFT, E, movetoworkspace, special:mail
# Terminal overlay
bind = $mainMod, Q, togglespecialworkspace, term
bind = $mainMod SHIFT, Q, movetoworkspace, special:term

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# alt when hardware keys aren't available
bindl = $mainMod ALT, space, exec, playerctl play-pause
bindl = $mainMod ALT, right, exec, playerctl next
bindl = $mainMod ALT, left, exec, playerctl previous
bindel = $mainMod ALT, up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod ALT, down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
